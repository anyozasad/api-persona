name: Rebuild Mallqui gym exterior HQ

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-mallqui-exterior-hq.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: "!contains(github.event.head_commit.message, '[mallqui-exterior-hq]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Rebuild high quality local 4K exterior
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/mallqui-hq.part0.b64 .tmp/mallqui-hq.part1.b64 .tmp/mallqui-hq.part2.b64 | base64 -d > /tmp/mallqui-hq.avif
          test "$(stat -c%s /tmp/mallqui-hq.avif)" -eq 99736
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/mallqui-hq.avif)" -eq 1600
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 /tmp/mallqui-hq.avif)" -eq 900

          ffmpeg -hide_banner -loglevel error -y             -i /tmp/mallqui-hq.avif             -vf "scale=3840:2160:flags=lanczos,unsharp=5:5:0.65:3:3:0.18,eq=contrast=1.035:saturation=1.02:brightness=0.004"             -frames:v 1 -c:v libwebp -quality 96 -compression_level 6             FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp)" -eq 3840
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp)" -eq 2160

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Mejorar fachada real de Gimnasio en 4K [mallqui-exterior-hq]'
          git push origin HEAD:main
