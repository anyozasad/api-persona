name: Rebuild Mallqui exterior from original

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-mallqui-exterior-hq.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: "!contains(github.event.head_commit.message, '[mallqui-exterior-hq-ok]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Reconstruct exact original without artificial upscale
        shell: bash
        run: |
          set -euo pipefail
          cat             .tmp/mallqui-original.part00.b64             .tmp/mallqui-original.part01.b64             .tmp/mallqui-original.part02.b64             .tmp/mallqui-original.part03.b64             .tmp/mallqui-original.part04.b64             .tmp/mallqui-original.part05.b64             .tmp/mallqui-original.part06.b64             .tmp/mallqui-original.part07.b64             .tmp/mallqui-original.part08.b64             .tmp/mallqui-original.part09.b64             .tmp/mallqui-original.part10.b64             .tmp/mallqui-original.part11.b64             .tmp/mallqui-original.part12.b64             .tmp/mallqui-original.part13.b64             | base64 -d > /tmp/mallqui-original.jpeg

          test "$(stat -c%s /tmp/mallqui-original.jpeg)" -eq 179345
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/mallqui-original.jpeg)" -eq 1600
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 /tmp/mallqui-original.jpeg)" -eq 900

          ffmpeg -hide_banner -loglevel error -y             -i /tmp/mallqui-original.jpeg             -vf "unsharp=5:5:0.32:3:3:0.08"             -frames:v 1 -c:v libwebp -quality 98 -compression_level 6             FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp)" -eq 1600
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp)" -eq 900

      - name: Commit final image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Reconstruir fachada Mallqui desde foto original sin escalado [mallqui-exterior-hq-ok]'
          git pull --rebase origin main
          git push origin HEAD:main
