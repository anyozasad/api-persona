name: Final sharpen only Mallqui Gym image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-sharpen-mallqui.yml'

permissions:
  contents: write

jobs:
  sharpen_image_only:
    if: "!contains(github.event.head_commit.message, '[final-sharp-image]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCV
        run: |
          python -m pip install --quiet opencv-python-headless

      - name: Rebuild original and enhance only pixels
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/mallqui-original.part*.b64 | base64 -d > /tmp/mallqui-original.jpg
          test "$(stat -c%s /tmp/mallqui-original.jpg)" -eq 179345

          python - <<'PY'
          import cv2
          import numpy as np

          src = cv2.imread('/tmp/mallqui-original.jpg', cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit('No se pudo leer la foto original')

          # Contraste local para quitar apariencia de neblina sin cambiar composición.
          lab = cv2.cvtColor(src, cv2.COLOR_BGR2LAB)
          l, a, b = cv2.split(lab)
          clahe = cv2.createCLAHE(clipLimit=2.0, tileGridSize=(8, 8))
          l = clahe.apply(l)
          img = cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)

          # Limpieza suave para que el enfoque no amplifique ruido.
          img = cv2.bilateralFilter(img, 5, 20, 20)

          # Enfoque fuerte sobre el detalle real original.
          blur = cv2.GaussianBlur(img, (0, 0), 1.2)
          img = cv2.addWeighted(img, 1.90, blur, -0.90, 0)
          blur2 = cv2.GaussianBlur(img, (0, 0), 0.60)
          img = cv2.addWeighted(img, 1.35, blur2, -0.35, 0)

          # Ampliación Lanczos conservando exactamente 16:9.
          img = cv2.resize(img, (3200, 1800), interpolation=cv2.INTER_LANCZOS4)

          # Microenfoque después del escalado.
          blur3 = cv2.GaussianBlur(img, (0, 0), 0.80)
          img = cv2.addWeighted(img, 1.35, blur3, -0.35, 0)

          out = 'FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp'
          ok = cv2.imwrite(out, img, [cv2.IMWRITE_WEBP_QUALITY, 100])
          if not ok:
              raise SystemExit('No se pudo guardar WebP')

          check = cv2.imread(out)
          if check is None or check.shape[1] != 3200 or check.shape[0] != 1800:
              raise SystemExit('Dimensiones de salida incorrectas')
          PY

      - name: Commit only the image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Enfocar solo imagen de Gimnasio [final-sharp-image]'
          git pull --rebase origin main
          git push origin HEAD:main
