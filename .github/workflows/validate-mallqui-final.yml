name: Validar Mallqui Gym final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-mallqui-final.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FRONTEND/suma-angular/package-lock.json

      - name: Instalar frontend
        working-directory: FRONTEND/suma-angular
        run: npm ci

      - name: Compilar Angular
        working-directory: FRONTEND/suma-angular
        run: npm run build

      - name: Validar PHP modificado
        run: |
          php -l BACKEND/routes/api.php
          php -l BACKEND/app/Http/Controllers/AdminGymRecordController.php
          php -l BACKEND/app/Http/Controllers/EntrenadorController.php
          php -l BACKEND/app/Http/Controllers/PortalClienteController.php
          php -l BACKEND/app/Services/ComprobanteMembresiaService.php
