name: Natural Mallqui Gym photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/natural-mallqui-photo.yml'

permissions:
  contents: write

jobs:
  image_only:
    if: "!contains(github.event.head_commit.message, '[natural-photo-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCV
        run: python -m pip install --quiet opencv-python-headless

      - name: Build clean natural photo only
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/mallqui-original.part*.b64 | base64 -d > /tmp/mallqui-original.jpg
          test "$(stat -c%s /tmp/mallqui-original.jpg)" -eq 179345

          python - <<'PY'
          import cv2, numpy as np

          src = cv2.imread('/tmp/mallqui-original.jpg', cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit('No se pudo leer la foto original')

          img = src.copy()

          # Contraste local MUY moderado para quitar velo sin crear halos.
          lab = cv2.cvtColor(img, cv2.COLOR_BGR2LAB)
          l, a, b = cv2.split(lab)
          l = cv2.createCLAHE(clipLimit=1.18, tileGridSize=(12, 12)).apply(l)
          img = cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)

          # Medios tonos levemente más claros.
          gamma = 0.96
          lut = np.array([((i / 255.0) ** gamma) * 255 for i in range(256)], dtype=np.uint8)
          img = cv2.LUT(img, lut)

          # Saturación muy ligera para el letrero.
          hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV).astype(np.float32)
          hsv[:, :, 1] = np.clip(hsv[:, :, 1] * 1.05, 0, 255)
          img = cv2.cvtColor(hsv.astype(np.uint8), cv2.COLOR_HSV2BGR)

          # Enfoque natural, sin detailEnhance y sin segundo sharpen.
          blur = cv2.GaussianBlur(img, (0, 0), 0.85)
          img = cv2.addWeighted(img, 1.32, blur, -0.32, 0)

          # Mantener resolución original real: 1600x900.
          out = 'FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-natural.webp'
          if not cv2.imwrite(out, img, [cv2.IMWRITE_WEBP_QUALITY, 100]):
              raise SystemExit('No se pudo guardar la imagen')

          check = cv2.imread(out)
          if check is None or check.shape[:2] != (900, 1600):
              raise SystemExit('Dimensiones incorrectas')
          PY

      - name: Commit only new photo file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-natural.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Crear foto natural y nítida de Gimnasio [natural-photo-done]'
          git pull --rebase origin main
          git push origin HEAD:main
