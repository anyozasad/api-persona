name: Verify Mallqui Gym dashboard

on:
  push:
    branches: [main]
    paths:
      - 'FRONTEND/suma-angular/**'
      - 'BACKEND/**'
      - '.github/workflows/verify-mallqui-dashboard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'FRONTEND/suma-angular/**'
      - 'BACKEND/**'
      - '.github/workflows/verify-mallqui-dashboard.yml'

permissions:
  contents: read

jobs:
  angular-build:
    name: Angular dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND/suma-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: FRONTEND/suma-angular/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Compile production dashboard
        run: npm run build -- --configuration production

  laravel-dashboard:
    name: Laravel dashboard functional tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: mallqui_gym_pruebas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: BACKEND

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mallqui_gym_pruebas
      DB_USERNAME: root
      DB_PASSWORD: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo
          coverage: none

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear

      - name: Test dashboard navigation and summary
        run: php artisan test tests/Feature/AdminDashboardNavigationTest.php tests/Feature/DashboardResumenTest.php

      - name: Test advanced dashboard modules
        run: php artisan test tests/Feature/AdminAdvancedCoreSchemaTest.php

      - name: Test memberships and reservations
        run: php artisan test tests/Feature/MembresiaProcesoFlowTest.php tests/Feature/ReservaClienteFlowTest.php

      - name: Test sales cash and inventory
        run: php artisan test tests/Feature/CajaVentaInventarioFlowTest.php tests/Feature/CompraInventarioFlowTest.php
