name: Empaquetar proyecto RAR

on:
  push:
    branches: [main]

jobs:
  paquete:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: gym_system
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Instalar dependencias backend
        working-directory: BACKEND
        run: composer install --no-interaction --prefer-dist

      - name: Crear estructura actual de gym_system
        working-directory: BACKEND
        run: |
          cat > .env <<'EOF'
          APP_NAME="Mallqui Gym"
          APP_ENV=local
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost:8000
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=gym_system
          DB_TABLE_PREFIX=app_
          GYM_DB_DATABASE=gym_system
          DB_USERNAME=root
          DB_PASSWORD=
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          EOF
          php artisan key:generate --force
          php artisan config:clear
          php artisan migrate --force

      - name: Exportar SQL actualizado
        run: |
          mysqldump -h 127.0.0.1 -P 3306 -u root \
            --routines --triggers --events --single-transaction \
            --no-tablespaces gym_system > gym_system_dump.tmp.sql

          cat > gym_system_ESTRUCTURA_ACTUALIZADA.sql <<'EOF'
          SET NAMES utf8mb4;
          CREATE DATABASE IF NOT EXISTS `gym_system`
            CHARACTER SET utf8mb4
            COLLATE utf8mb4_unicode_ci;
          USE `gym_system`;
          SET FOREIGN_KEY_CHECKS=0;
          EOF

          cat gym_system_dump.tmp.sql >> gym_system_ESTRUCTURA_ACTUALIZADA.sql
          echo "SET FOREIGN_KEY_CHECKS=1;" >> gym_system_ESTRUCTURA_ACTUALIZADA.sql
          rm gym_system_dump.tmp.sql

      - name: Preparar paquete
        run: |
          mkdir -p MALLQUI_GYM_COMPLETO
          git archive HEAD | tar -x -C MALLQUI_GYM_COMPLETO
          cp gym_system_ESTRUCTURA_ACTUALIZADA.sql MALLQUI_GYM_COMPLETO/
          cat > MALLQUI_GYM_COMPLETO/LEEME_INSTALACION.txt <<'EOF'
          MALLQUI GYM - INSTALACION EN OTRA PC

          1. Instalar XAMPP, Composer, Node.js y Angular CLI.
          2. Iniciar Apache y MySQL en XAMPP.
          3. Entrar a phpMyAdmin.
          4. Ir a Importar directamente.
          5. Importar gym_system_ESTRUCTURA_ACTUALIZADA.sql. El archivo crea y selecciona gym_system automáticamente.
          6. En BACKEND, crear .env usando .env.example.
          7. Verificar:
             DB_DATABASE=gym_system
             DB_TABLE_PREFIX=app_
             GYM_DB_DATABASE=gym_system
             DB_USERNAME=root
             DB_PASSWORD=
          8. Ejecutar en BACKEND:
             composer install
             php artisan key:generate
             php artisan optimize:clear
             php artisan migrate --force
             php artisan gym:sincronizar-clientes
             php artisan serve

             La tabla app_clientes es la tabla moderna usada por el sistema.
             La tabla socios es la tabla legacy visible en gym_system.
             El comando gym:sincronizar-clientes copia/actualiza cada cliente
             real de app_clientes hacia socios usando el DNI, sin duplicarlo.
             Los nuevos clientes también se sincronizan automáticamente.
          9. Ejecutar en FRONTEND/suma-angular:
             npm install
             ng serve

          NOTA:
          Este SQL contiene la estructura actualizada del sistema generada desde
          las migraciones del proyecto. Los registros personales de la PC original
          (clientes, pagos, ventas, etc.) no se incluyen automáticamente.
          EOF

      - name: Instalar RAR
        run: |
          sudo apt-get update
          sudo apt-get install -y rar

      - name: Crear RAR completo
        run: rar a -r -m5 MALLQUI_GYM_COMPLETO_CON_BD.rar MALLQUI_GYM_COMPLETO

      - name: Subir RAR
        uses: actions/upload-artifact@v4
        with:
          name: MALLQUI_GYM_COMPLETO_CON_BD
          path: MALLQUI_GYM_COMPLETO_CON_BD.rar
          compression-level: 0
          retention-days: 7
