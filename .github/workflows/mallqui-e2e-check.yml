name: Mallqui Gym - compilación y pruebas EFSRT

on:
  push:
    branches: [main]
    paths:
      - 'FRONTEND/suma-angular/**'
      - 'BACKEND/**'
      - 'scripts/INICIAR_DASHBOARD.ps1'
      - '.github/workflows/mallqui-e2e-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular:
    name: Angular 20 - compilación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: FRONTEND/suma-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONTEND/suma-angular/package-lock.json
      - name: Instalar paquetes reproduciblemente
        run: npm ci --no-audit --no-fund
      - name: Validar sintaxis del iniciador Windows
        shell: pwsh
        working-directory: .
        run: |
          $tokens = $null
          $errores = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/INICIAR_DASHBOARD.ps1', [ref]$tokens, [ref]$errores) | Out-Null
          if ($errores.Count -gt 0) {
            $errores | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Compilar frontend de producción
        run: npm run build
      - name: Probar dashboard Angular sin interacción
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

  laravel:
    name: Laravel 12 - MySQL y pruebas funcionales
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gymci
          MYSQL_DATABASE: mallqui_gym_pruebas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgymci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: BACKEND
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mallqui_gym_pruebas
      GYM_DB_DATABASE: mallqui_gym_pruebas
      DB_USERNAME: root
      DB_PASSWORD: gymci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, dom, curl, xml, gd
          coverage: none
          tools: composer:v2
      - name: Instalar dependencias de Laravel
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configurar entorno de integración
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Verificar sintaxis de controladores y pruebas
        run: |
          find app/Http/Controllers app/Services tests/Feature -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Ejecutar migraciones en la BD temporal de GitHub
        run: php artisan migrate --force
      - name: Probar recuperación del esquema legacy en MySQL temporal
        run: |
          # Base aislada de GitHub Actions: nunca se usan datos del XAMPP local.
          # Reproducir las tablas ausentes vistas en Socios/Planes/Membresías.
          php artisan tinker --execute='DB::statement("SET FOREIGN_KEY_CHECKS=0"); Schema::dropIfExists("cliente_membresia"); Schema::dropIfExists("membresias"); Schema::dropIfExists("clientes"); DB::statement("SET FOREIGN_KEY_CHECKS=1");'
          php artisan db:reconciliar-esquema
          php artisan db:verificar
      - name: Verificar rutas de reservas, pagos y EFSRT
        run: php artisan route:list --path=api --except-vendor
      - name: Ejecutar pruebas del flujo principal
        run: |
          php artisan test --filter=AccesoDashboardAdministradorTest
          php artisan test --filter=ReservaClienteFlowTest
          php artisan test --filter=ComprobanteMembresiaTest
          php artisan test --filter=VerificacionEfsrtTest
          php artisan test --filter=ProductoImagenDashboardTest
          php artisan test --filter=ProductoModernLegacyBridgeTest
          php artisan test --filter=KardexLegacyRealTest
          php artisan test --filter=EfsrtInterfazEvidenciaTest
      - name: Calidad del software - 150 contratos independientes y 46 rutas seguras
        run: |
          php artisan test --filter=PortalCliente150FuncionesTest
          php artisan test --filter=SecuritySmokeTest
          php artisan mallqui:cliente-funciones --fallos
      - name: Ejecutar suite completa de Laravel con BD aislada
        run: |
          php artisan migrate:fresh --force
          php artisan test
