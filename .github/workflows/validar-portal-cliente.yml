name: Validar portal cliente

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: mallqui_gym_pruebas
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.testing .env
          php artisan config:clear
          php artisan migrate:fresh --force
      - run: php artisan mallqui:cliente-funciones
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND/suma-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: FRONTEND/suma-angular/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless
