name: Mallqui Gym - validacion integral
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  angular:
    name: Compilar Angular y probar navegacion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FRONTEND/suma-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONTEND/suma-angular/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Compilar Angular
        run: npm run build
      - name: Probar el dashboard
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress

  laravel:
    name: Verificar Laravel y rutas API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, xml, pdo_mysql, fileinfo
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configurar entorno temporal
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Verificar sintaxis de controladores
        run: find app/Http/Controllers -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Comprobar registro de rutas
        run: php artisan route:list --path=api
