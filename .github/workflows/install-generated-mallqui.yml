name: Install generated Mallqui Gym image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-generated-mallqui.yml'

permissions:
  contents: write

jobs:
  install_image:
    if: "!contains(github.event.head_commit.message, '[generated-mallqui-installed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact generated PNG
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/mallqui-ai/chunk_* | base64 -d > /tmp/mallqui-gym-ai.png
          echo "9e38d215d049d47b4dee8a67a20857fc4eb06ba80f2602973bbc6782c4f701b7  /tmp/mallqui-gym-ai.png" | sha256sum -c -
          file /tmp/mallqui-gym-ai.png

          mkdir -p FRONTEND/suma-angular/public/assets/mallqui
          cp /tmp/mallqui-gym-ai.png FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-ai.png

      - name: Commit only generated image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-ai.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Guardar imagen IA nítida de Gimnasio [generated-mallqui-installed]'
          git pull --rebase origin main
          git push origin HEAD:main
