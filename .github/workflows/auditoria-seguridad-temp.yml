name: Auditoria seguridad temporal

on:
  push:
    branches: [main]

jobs:
  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND/suma-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: FRONTEND/suma-angular/package-lock.json
      - run: npm install
      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high || true
      - name: Auditar todas las dependencias
        run: npm audit --audit-level=critical || true

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Auditar Composer
        run: composer audit || true
