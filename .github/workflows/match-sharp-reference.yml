name: Match sharp reference image only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-sharp-reference.yml'

permissions:
  contents: write

jobs:
  image_only:
    if: "!contains(github.event.head_commit.message, '[sharp-reference-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCV
        run: python -m pip install --quiet opencv-python-headless

      - name: Rebuild original and apply strong reference-like clarity
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/mallqui-original.part*.b64 | base64 -d > /tmp/mallqui-original.jpg
          test "$(stat -c%s /tmp/mallqui-original.jpg)" -eq 179345

          python - <<'PY'
          import cv2, numpy as np
          src = cv2.imread('/tmp/mallqui-original.jpg', cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit('No se pudo leer la foto original')

          f = src.astype(np.float32)
          means = f.reshape(-1, 3).mean(axis=0)
          gain = means.mean() / means
          img = np.clip(f * gain, 0, 255).astype(np.uint8)

          lab = cv2.cvtColor(img, cv2.COLOR_BGR2LAB)
          l, a, b = cv2.split(lab)
          l = cv2.createCLAHE(clipLimit=2.2, tileGridSize=(8, 8)).apply(l)
          img = cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)

          gamma = 0.88
          lut = np.array([((i / 255.0) ** gamma) * 255 for i in range(256)], dtype=np.uint8)
          img = cv2.LUT(img, lut)

          blur = cv2.GaussianBlur(img, (0, 0), 1.0)
          img = cv2.addWeighted(img, 1.80, blur, -0.80, 0)
          img = cv2.detailEnhance(img, sigma_s=8, sigma_r=0.15)

          hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV).astype(np.float32)
          hsv[:, :, 1] = np.clip(hsv[:, :, 1] * 1.08, 0, 255)
          img = cv2.cvtColor(hsv.astype(np.uint8), cv2.COLOR_HSV2BGR)

          img = cv2.resize(img, (3200, 1800), interpolation=cv2.INTER_LANCZOS4)
          blur2 = cv2.GaussianBlur(img, (0, 0), 0.65)
          img = cv2.addWeighted(img, 1.22, blur2, -0.22, 0)

          out = 'FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp'
          if not cv2.imwrite(out, img, [cv2.IMWRITE_WEBP_QUALITY, 100]):
              raise SystemExit('No se pudo guardar la imagen')
          check = cv2.imread(out)
          if check is None or check.shape[:2] != (1800, 3200):
              raise SystemExit('Dimensiones incorrectas')
          PY

      - name: Commit only image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-4k.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Igualar nitidez a referencia de Gimnasio [sharp-reference-done]'
          git pull --rebase origin main
          git push origin HEAD:main
