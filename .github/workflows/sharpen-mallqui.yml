name: Replace Mallqui level images with real local 4K photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sharpen-mallqui.yml'

permissions:
  contents: write

jobs:
  replace:
    if: "!contains(github.event.head_commit.message, '[levels-hd]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image processor
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Download real HD gym photos and store locally
        shell: bash
        run: |
          set -euo pipefail
          DIR='FRONTEND/suma-angular/public/assets/mallqui'
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1704223523321-7b0b44a1a0b9?auto=format&fit=crop&q=95&w=4000' -o /tmp/beginner.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1770664612843-b44e26070024?auto=format&fit=crop&q=95&w=4000' -o /tmp/pro.jpg

          ffmpeg -hide_banner -loglevel error -y -i /tmp/beginner.jpg -vf "scale=3840:2160:force_original_aspect_ratio=increase,crop=3840:2160,unsharp=5:5:0.55:3:3:0.15" -frames:v 1 -c:v libwebp -quality 96 -compression_level 6 "$DIR/mallqui-beginner-ai-4k.webp"
          ffmpeg -hide_banner -loglevel error -y -i /tmp/pro.jpg -vf "scale=3840:2160:force_original_aspect_ratio=increase,crop=3840:2160,unsharp=5:5:0.55:3:3:0.15" -frames:v 1 -c:v libwebp -quality 96 -compression_level 6 "$DIR/mallqui-pro-ai-4k.webp"

      - name: Verify real 4K output
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 FRONTEND/suma-angular/public/assets/mallqui/mallqui-beginner-ai-4k.webp
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 FRONTEND/suma-angular/public/assets/mallqui/mallqui-pro-ai-4k.webp

      - name: Commit only the two local photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-beginner-ai-4k.webp FRONTEND/suma-angular/public/assets/mallqui/mallqui-pro-ai-4k.webp
          if git diff --cached --quiet; then
            echo 'No image changes detected.'
            exit 0
          fi
          git commit -m 'Reemplazar niveles por fotos reales 4K locales [levels-hd]'
          git push origin HEAD:main
