name: Edge selective sharpen Mallqui

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge-selective-mallqui.yml'

permissions:
  contents: write

jobs:
  image_only:
    if: "!contains(github.event.head_commit.message, '[edge-selective-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCV
        run: python -m pip install --quiet opencv-python-headless

      - name: Build selective sharp photo only
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/mallqui-original.part*.b64 | base64 -d > /tmp/mallqui-original.jpg
          test "$(stat -c%s /tmp/mallqui-original.jpg)" -eq 179345

          python - <<'PY'
          import cv2
          import numpy as np

          src = cv2.imread('/tmp/mallqui-original.jpg', cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit('No se pudo leer la foto original')

          # Balance de blancos moderado.
          f = src.astype(np.float32)
          means = f.reshape(-1, 3).mean(axis=0)
          gain = np.clip(means.mean() / means, 0.92, 1.08)
          img = np.clip(f * gain, 0, 255).astype(np.uint8)

          # Contraste local moderado.
          lab = cv2.cvtColor(img, cv2.COLOR_BGR2LAB)
          l, a, b = cv2.split(lab)
          l = cv2.createCLAHE(clipLimit=1.45, tileGridSize=(10, 10)).apply(l)
          img = cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)

          # Un poco más de contraste global y saturación.
          img = cv2.convertScaleAbs(img, alpha=1.06, beta=2)
          hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV).astype(np.float32)
          hsv[:, :, 1] = np.clip(hsv[:, :, 1] * 1.07, 0, 255)
          img = cv2.cvtColor(hsv.astype(np.uint8), cv2.COLOR_HSV2BGR)

          # Escalar antes del enfoque para conservar bordes al mostrar en pantalla grande.
          img = cv2.resize(img, (3200, 1800), interpolation=cv2.INTER_LANCZOS4)

          # Enfoque selectivo: solo bordes reales, no áreas planas/ruido.
          gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
          lap = cv2.Laplacian(gray, cv2.CV_32F, ksize=3)
          edge = np.abs(lap)
          mask = np.clip((edge - 12.0) / 32.0, 0.0, 1.0)
          mask = cv2.GaussianBlur(mask, (0, 0), 0.8)
          mask3 = np.dstack([mask, mask, mask]).astype(np.float32)

          blur = cv2.GaussianBlur(img, (0, 0), 1.0)
          sharp = cv2.addWeighted(img, 1.65, blur, -0.65, 0)

          base = img.astype(np.float32)
          sharpf = sharp.astype(np.float32)
          out = np.clip(base * (1.0 - mask3) + sharpf * mask3, 0, 255).astype(np.uint8)

          dst = 'FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-natural.webp'
          if not cv2.imwrite(dst, out, [cv2.IMWRITE_WEBP_QUALITY, 100]):
              raise SystemExit('No se pudo guardar la imagen')

          check = cv2.imread(dst)
          if check is None or check.shape[:2] != (1800, 3200):
              raise SystemExit('Salida incorrecta')
          PY

      - name: Commit only image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/suma-angular/public/assets/mallqui/mallqui-gym-exterior-natural.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Mejorar bordes de foto Gimnasio sin tocar interfaz [edge-selective-done]'
          git pull --rebase origin main
          git push origin HEAD:main
